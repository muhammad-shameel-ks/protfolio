<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFCFA"/>
      <stop offset="1" stop-color="#FAF6F2"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F5E6DA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F5E6DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EAE0F5" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#EAE0F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="320" fill="url(#blob1)"/>
  <circle cx="160" cy="540" r="280" fill="url(#blob2)"/>

  <!-- Accent logo mark -->
  <rect x="80" y="80" width="56" height="56" rx="14" fill="#E8613C"/>
  <text x="108" y="120" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Silkscreen, monospace">S</text>

  <!-- Pixel eyebrow -->
  <text x="80" y="230" font-size="20" letter-spacing="4" fill="#E8613C" font-weight="700" font-family="Silkscreen, monospace">LINUX · KUBERNETES · CI/CD · HOME LAB</text>

  <!-- Name -->
  <text x="76" y="320" font-size="88" font-weight="800" fill="#1A1A1A" letter-spacing="-2">Hey, I'm<tspan fill="#E8613C"> Shameel</tspan></text>

  <!-- Subtitle -->
  <text x="80" y="390" font-size="32" font-weight="400" fill="#737373">Full-stack engineer walking the DevOps path.</text>
  <text x="80" y="434" font-size="32" font-weight="400" fill="#737373">From Arch Linux to Kubernetes — I build, run, automate.</text>

  <!-- Status pill -->
  <rect x="80" y="486" width="240" height="44" rx="22" fill="#E0F0E6"/>
  <circle cx="104" cy="508" r="6" fill="#22C55E"/>
  <text x="120" y="514" font-size="18" font-weight="500" fill="#166534">Open to opportunities</text>

  <!-- Footer line -->
  <text x="80" y="584" font-size="18" fill="#B5B5B5" font-family="JetBrains Mono, monospace">shameel.barchy.online</text>
</svg>
